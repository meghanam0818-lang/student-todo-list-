<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student To-Do List</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 16px;
      font-family: Arial, sans-serif; background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
      color: #1f2937; display: flex; justify-content: center; align-items: flex-start;
    }
    .app {
      width: 100%; max-width: 520px; background: #fff; padding: 28px;
      border-radius: 18px; box-shadow: 0 12px 35px rgba(31, 41, 55, .12);
    }
    h1 { margin: 0 0 8px; text-align: center; color: #4338ca; }
    .subtitle { text-align: center; color: #6b7280; margin: 0 0 24px; }
    .entry { display: flex; gap: 8px; }
    input {
      min-width: 0; flex: 1; padding: 12px; border: 1px solid #d1d5db;
      border-radius: 10px; font-size: 16px;
    }
    button {
      border: 0; border-radius: 10px; padding: 11px 14px; cursor: pointer;
      font-weight: 600; background: #4f46e5; color: white;
    }
    button:hover { filter: brightness(.95); }
    #taskList { list-style: none; padding: 0; margin: 20px 0 0; }
    li {
      display: flex; align-items: center; gap: 10px; padding: 12px;
      border: 1px solid #e5e7eb; border-radius: 10px; margin-bottom: 10px;
    }
    li span { flex: 1; overflow-wrap: anywhere; cursor: pointer; }
    li.completed span { text-decoration: line-through; color: #9ca3af; }
    .delete { background: #ef4444; padding: 8px 10px; }
    .empty { text-align: center; color: #9ca3af; padding: 18px 0; }
    .footer { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 22px; }
    @media (max-width: 420px) { .app { padding: 20px; } .entry { flex-direction: column; } }
  </style>
</head>
<body>
  <main class="app">
    <h1>📝 Student To-Do List</h1>
    <p class="subtitle">Plan your day, one task at a time.</p>
    <form id="taskForm" class="entry">
      <input id="taskInput" type="text" placeholder="Enter a task or assignment..." maxlength="200" autocomplete="off" aria-label="New task">
      <button type="submit">Add Task</button>
    </form>
    <ul id="taskList" aria-live="polite"></ul>
    <p class="footer">Student To-Do List • Built with HTML, CSS & JavaScript</p>
  </main>
  <script>
    const STORAGE_KEY = "student-todo-list-tasks";
    const form = document.getElementById("taskForm");
    const input = document.getElementById("taskInput");
    const list = document.getElementById("taskList");
    let tasks = [];

    try {
      tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (!Array.isArray(tasks)) tasks = [];
    } catch {
      tasks = [];
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function renderTasks() {
      list.replaceChildren();
      if (tasks.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "No tasks yet. Add your first task above! ✨";
        list.appendChild(empty);
        return;
      }

      tasks.forEach((task) => {
        const li = document.createElement("li");
        if (task.completed) li.classList.add("completed");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", "Mark task complete");
        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const span = document.createElement("span");
        span.textContent = task.text;
        span.addEventListener("click", () => {
          task.completed = !task.completed;
          saveTasks();
          renderTasks();
        });

        const del = document.createElement("button");
        del.type = "button";
        del.className = "delete";
        del.textContent = "Delete";
        del.addEventListener("click", () => {
          tasks = tasks.filter((item) => item.id !== task.id);
          saveTasks();
          renderTasks();
        });

        li.append(checkbox, span, del);
        list.appendChild(li);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }
      tasks.push({ id: Date.now().toString() + Math.random().toString(16).slice(2), text, completed: false });
      saveTasks();
      renderTasks();
      input.value = "";
      input.focus();
    });

    renderTasks();
  </script>
</body>
</html>
